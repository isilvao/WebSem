<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSem Files</title>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --link: #4493f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 6px; }
    li { display: flex; gap: 12px; align-items: baseline; padding: 10px 16px; border-top: 1px solid var(--border); }
    li:first-child { border-top: 0; }
    .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 0.875rem; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Web Semantics – Files</h1>
    <p>Files in <a href="https://github.com/isilvao/WebSem">isilvao/WebSem</a></p>

    <!-- Static fallback; replaced by the live list from the GitHub API when it loads. -->
    <ul id="files">
      <li><a class="name" href="SilvaOyola-cycling.owx">SilvaOyola-cycling.owx</a></li>
    </ul>
  </main>

  <script>
    const OWNER = "isilvao", REPO = "WebSem", BRANCH = "main";
    const HIDDEN = new Set(["index.html"]);

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`)
      .then(res => res.ok ? res.json() : Promise.reject(res.status))
      .then(data => {
        const files = data.tree
          .filter(item => item.type === "blob")
          .filter(item => !HIDDEN.has(item.path) && !item.path.split("/").some(part => part.startsWith(".")))
          .sort((a, b) => a.path.localeCompare(b.path));

        const list = document.getElementById("files");
        list.replaceChildren(...files.map(file => {
          const li = document.createElement("li");

          const link = document.createElement("a");
          link.className = "name";
          link.href = file.path.split("/").map(encodeURIComponent).join("/");
          link.textContent = file.path;

          const size = document.createElement("span");
          size.className = "meta";
          size.textContent = formatSize(file.size);

          const source = document.createElement("a");
          source.className = "meta";
          source.href = `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${file.path}`;
          source.textContent = "GitHub";

          li.append(link, size, source);
          return li;
        }));
      })
      .catch(() => { /* keep the static fallback list */ });
  </script>
</body>
</html>
